<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2f7a5a">
<meta name="format-detection" content="telephone=no">
<title>家长端 · 孩子的学习记录</title>
<style>
  :root{
    --bg:#f4f7f4; --card:#fff; --ink:#22312a; --ink2:#5b6c62; --line:#e3ece6;
    --g:#2f7a5a; --g2:#3f9a72; --gold:#c9932a; --red:#c8442f; --shadow:0 2px 10px rgba(30,60,45,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  /* ---------- 登录 ---------- */
  .login{padding:26px 18px;background:linear-gradient(160deg,#eaf5ee,#f7fbf8 60%,#fff);min-height:100vh}
  .login h1{font-size:21px;margin:6px 0 4px;letter-spacing:.5px}
  .login .sub{color:var(--ink2);font-size:13px;margin-bottom:18px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
  .fld input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;
    font-size:16px;color:var(--ink);outline:none;transition:border-color .15s}
  .fld input:focus{border-color:var(--g2)}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;
    font-size:16px;font-weight:600;letter-spacing:.5px;cursor:pointer}
  .btn:active{opacity:.85}
  .btn[disabled]{background:#b9c9c1}
  .btn2{display:inline-block;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;
    color:var(--g);font-size:13px;font-weight:600;cursor:pointer}
  .btn2:active{background:#eef6f1}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
  .hint{margin-top:18px;font-size:12px;color:var(--ink2);line-height:1.8;border-top:1px dashed var(--line);padding-top:12px}
  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:4px 2px}
  .top .who{font-size:17px;font-weight:700}
  .top .who small{font-size:12px;font-weight:400;color:var(--ink2);margin-left:6px}
  .top .tools{display:flex;gap:8px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--g2);display:inline-block;margin-right:4px}
  /* ---------- 卡片 ---------- */
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 15px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .card h2 em{font-style:normal;font-size:12px;color:#9aa8a0;font-weight:400}
  .points{display:flex;align-items:flex-end;gap:14px}
  .points .big{font-size:34px;font-weight:800;color:var(--g);line-height:1}
  .points .big small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:3px}
  .points .side{font-size:12px;color:var(--ink2);line-height:1.7;padding-bottom:3px}
  .kpis{display:flex;gap:8px;margin-top:12px}
  .kpi{flex:1;background:#f7faf8;border-radius:12px;padding:9px 10px;text-align:center}
  .kpi b{display:block;font-size:18px;color:var(--ink)}
  .kpi span{font-size:11px;color:var(--ink2)}
  /* vT163 图鉴分栏（已养灵宠 / 已集灵杰） */
  .cxsub{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);margin:13px 0 8px}
  .cxsub:first-of-type{margin-top:2px}
  .cxsub small{font-size:11px;font-weight:400;color:#9aa8a0}
  /* vT163 本周表现 */
  .wkhero{display:flex;align-items:center;gap:11px;border-radius:13px;padding:12px;margin-bottom:11px}
  .wkhero.c-g{background:#e8f5ec}.wkhero.c-y{background:#fdf4df}.wkhero.c-z{background:#eef3fd}.wkhero.c-r{background:#fdeceb}
  .wkface{font-size:30px;line-height:1;flex:none}
  .wkmain{flex:1;min-width:0}
  .wkmain b{display:block;font-size:15px;color:var(--ink)}
  .wkmain span{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
  .wknet{text-align:center;flex:none;border-left:1px solid rgba(0,0,0,.08);padding-left:11px}
  .wknet b{display:block;font-size:21px;line-height:1.1}
  .wkhero.c-g .wknet b{color:#2b7a4b}.wkhero.c-y .wknet b{color:#a97a11}.wkhero.c-z .wknet b{color:#1f6feb}.wkhero.c-r .wknet b{color:#b4382a}
  .wknet span{font-size:10.5px;color:var(--ink2)}
  .wkstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .wkst{background:#f7faf8;border-radius:11px;padding:9px 6px;text-align:center}
  .wkst .wkn{display:block;font-size:11px;color:var(--ink2)}
  .wkst b{display:block;font-size:19px;color:var(--ink);line-height:1.35}
  .wkst b.up{color:#2b7a4b}.wkst b.down{color:#b4382a}
  .wkst small{display:block;font-size:10px;color:#9aa8a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wkfoot{font-size:11px;color:#9aa8a0;margin-top:10px;line-height:1.6}
  /* 作业 */
  .hw{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f2}
  .hw:last-child{border-bottom:0}
  .hw .nm{font-size:14px}
  /* vT131 未完成作业清单：日期 + 科目 + 分组 */
  .hw .hdt{font-style:normal;font-size:11.5px;color:#9aa8a0;margin-right:7px;font-variant-numeric:tabular-nums}
  .hw .hsj{font-style:normal;font-size:11px;color:#5b6b62;background:#f1f5f2;border-radius:6px;padding:1px 6px;margin-right:6px}
  .tsec{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#5b6b62;margin:15px 0 1px}
  .tsec i{font-style:normal;font-weight:700;font-size:11px;color:#b4382a;background:#fdeaea;border-radius:999px;padding:1px 8px}
  .tsec u{text-decoration:none;font-weight:400;font-size:11px;color:#9aa8a0;margin-left:auto}
  .chip.c-x{background:#fee2e2;color:#b91c1c}
  .hwfoot{font-size:11.5px;color:#9aa8a0;margin-top:11px;line-height:1.7}
  .okbig{text-align:center;padding:14px 0 8px}
  .okbig b{display:block;font-size:15px;color:#2b7a4b}
  .okbig span{display:block;font-size:11.5px;color:#9aa8a0;margin-top:5px}
  .chip{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
  .c-g{background:#e6f4ea;color:#2b7a4b}
  .c-y{background:#fdf3dd;color:#a97a11}
  .c-z{background:#eef3fd;color:#1f6feb}   /* vT146b 合格=蓝（与优秀绿/不错黄/欠佳红统一） */
  .c-r{background:#fdeaea;color:#b4382a}
  /* 留堂 */
  .warn{background:#fff6f4;border:1px solid #f6d9d2}
  .warn h2{color:#b4382a}
  .warn .why{font-size:13px;color:#8a4c41}
  /* 诵读 */
  .rc{display:flex;flex-wrap:wrap;gap:7px}
  .rc span{background:#eef6f1;color:#2f6b4f;border-radius:9px;padding:5px 11px;font-size:13px}
  /* vT130 诵读进度：已背 / 未背 + 篇目 */
  .rcbar{height:10px;border-radius:6px;background:#eef2ef;overflow:hidden;margin:10px 0 9px}
  .rcbar i{display:block;height:100%;background:linear-gradient(90deg,#5cbb8a,#93d9b1);transition:width .45s}
  .rcrow{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .rcrow b{color:var(--ink);font-size:15px;margin:0 2px}
  .rcdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:8px}
  .rcdot.ok{background:#4caf7d}
  .rcdot.no{background:#d6ded9}
  .rcsec{font-size:12.5px;color:var(--ink2);font-weight:600;margin:14px 0 7px;display:flex;align-items:center;gap:5px}
  .rcsec em{font-style:normal;font-weight:400;color:#9aa8a0;font-size:11px}
  .rctags{display:flex;flex-wrap:wrap;gap:6px}
  .rctag{font-size:12px;line-height:1.3;border-radius:9px;padding:4px 10px;background:#eef6f1;color:#2f6b4f}
  .rctag.no{background:#f4f6f4;color:#8c9a92}
  .rctag.ex{background:#fdf6e6;color:#a97a11}
  .rcfoot{font-size:11.5px;color:#9aa8a0;margin-top:11px;line-height:1.7}
  .empty{color:#9aa8a0;font-size:13px;text-align:center;padding:10px 0}
  /* vT210 灵宠置顶板块：内联欢迎气泡（替代弹窗，打开即见） */
  .pethero{background:linear-gradient(180deg,#fff8fa 0%,#fff 42%)}
  .petsay{display:flex;align-items:center;gap:11px;background:#fff5f8;border:1px solid #f7d7e2;border-radius:16px;padding:10px 13px;margin:2px 0 12px}
  .petsay-pet{width:46px;height:46px;object-fit:contain;border-radius:12px;background:#fff;flex:0 0 auto}
  .petsay-emo{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff;border-radius:12px;flex:0 0 auto}
  .petsay-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .petsay-body b{font-size:12px;color:#c2416a;font-weight:700}
  .petsay-body span{font-size:13.5px;color:#5a4a50;line-height:1.45}
  /* 图鉴 */
  .cxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .cx{background:#fbfdfb;border:1px solid var(--line);border-radius:13px;padding:7px 6px 8px;position:relative;overflow:hidden;text-align:center}
  /* vT210 图片兜底：加载中/失败时不留白框，用柔和底色 + 蛋蛋占位（家长网络差也不至于像"灵宠没了"） */
  .cx img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;border-radius:9px;
    background:linear-gradient(135deg,#f7fbf8,#eaf2ee);background-repeat:no-repeat;background-position:center}
  .cx .nm{font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cx .sr{font-size:10px;color:#9aa8a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* vT246 灵杰卡：品级用颜色区分（普通灰 / 隐藏紫 / 典藏金），后面接分类 */
  .cx .sr .tg{font-weight:700;color:#9aa8a0}
  .cx .sr .tg.h{color:#7a5cbf}
  .cx .sr .tg.j{color:#b8860b}
  .cx .ph{width:100%;aspect-ratio:1/1;border-radius:9px;background:#f2f6f3;display:flex;align-items:center;justify-content:center;font-size:26px}
  .tier{position:absolute;left:5px;top:5px;font-size:9px;padding:1px 6px;border-radius:7px;background:rgba(255,255,255,.88);color:#8a6a15;font-weight:700}
  .cx .st{position:absolute;right:5px;top:5px;font-size:9px;letter-spacing:-1px;padding:1px 5px;border-radius:7px;background:rgba(255,244,214,.94);color:#b8860b;font-weight:700}
  /* vT136 灵宠互动：点卡片捏捏 / 摸摸 / 玩耍（本地演出，不动成长值） */
  .cx.ispet{cursor:pointer}
  .cx.ispet:active{transform:scale(.97)}
  /* vT162 家长端灵宠三阶段常驻动效：奶团子轻飘 + 奶泡星点 / 幼年小弹跳 + 脚边尘土 / 成年金色光晕 */
  @keyframes ppPsFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes ppPsHop{0%,100%{transform:translateY(0) scale(1)}28%{transform:translateY(-5px) scale(1.012)}55%{transform:translateY(0) scale(.998)}}
  @keyframes ppPsGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,214,102,.30))}50%{filter:drop-shadow(0 0 13px rgba(255,214,102,.72))}}
  @keyframes ppPsPuff{0%,100%{opacity:.16;transform:translateY(0)}50%{opacity:.55;transform:translateY(-6px)}}
  @keyframes ppPsDust{0%{opacity:0;transform:translate(0,0) scale(.7)}30%{opacity:.5}100%{opacity:0;transform:translate(-10px,-4px) scale(1.2)}}
  .cx.ispet.ps-baby img{animation:ppPsFloat 3.8s ease-in-out infinite}
  .cx.ispet.ps-teen img{animation:ppPsHop 2.8s ease-in-out infinite}
  .cx.ispet.ps-adult img{animation:ppPsGlow 2.6s ease-in-out infinite}
  .cx.ispet.ps-baby::before{content:'';position:absolute;left:0;right:0;top:6px;height:64px;pointer-events:none;z-index:1;
    background-image:
      radial-gradient(circle at 20% 40%,#fff 0 1.6px,transparent 2.4px),
      radial-gradient(circle at 72% 24%,#e8f3ff 0 1.8px,transparent 2.6px),
      radial-gradient(circle at 46% 70%,#fff 0 1.4px,transparent 2.2px);
    animation:ppPsPuff 3.2s ease-in-out infinite}
  .cx.ispet.ps-teen::before{content:'';position:absolute;left:18%;bottom:26px;width:9px;height:5px;border-radius:50%;
    background:rgba(150,170,160,.5);pointer-events:none;z-index:1;animation:ppPsDust 1.4s ease-out infinite}
  @media (prefers-reduced-motion:reduce){.cx.ispet img,.cx.ispet::before,.cx.ispet::after{animation:none !important}}
  .cx .fheart{position:absolute;right:5px;bottom:22px;font-size:9px;color:#c2416a;background:#fff0f4;border-radius:7px;padding:1px 5px;font-weight:700}
  .cx .fly{position:absolute;left:50%;top:18%;font-size:20px;transform:translateX(-50%);animation:ppFly .9s ease forwards;pointer-events:none}
  @keyframes ppFly{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px) scale(1.3)}}
  .cx.bnc{animation:ppBob .5s ease}
  @keyframes ppBob{0%,100%{transform:none}30%{transform:translateY(-5px) scale(1.04)}60%{transform:translateY(-2px)}}
  .ppmenu{position:fixed;z-index:999;display:flex;gap:6px;flex-wrap:wrap;max-width:252px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.18)}
  .ppmenu button{border:none;background:#f2f8f4;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;color:#24483a;font-family:inherit}
  .ppmenu button:active{background:#e2f1ea}
  .ppmenu button.ppreal{background:#e8f6ee;color:#1f7a4d;box-shadow:inset 0 0 0 1px #bfe3cd}
  .ppmenu.pfeed{max-width:280px}
  .ppmenu.pfeed button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;line-height:1.35}
  .ppmenu.pfeed button i{font-style:normal;font-size:11px;color:#c0563f;font-weight:700}
  .ppmenu button.ppx{background:#f4f6f5;color:#8a9a92}
  .ppbub{position:fixed;z-index:999;background:#24483a;color:#fff;font-size:12px;font-weight:600;border-radius:11px 11px 11px 3px;padding:6px 10px;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .cxtip{font-size:11px;color:#9aa8a0;margin-top:8px}
  @keyframes cxsheen{0%{background-position:130% 0}100%{background-position:-130% 0}}
  /* vT117 品级分级：隐藏=紫罗兰慢扫光（柔）；典藏=鎏金快扫光 + 更强金晕（锐） */
  @keyframes cxpulse{0%,100%{box-shadow:0 0 6px 1px rgba(124,92,255,.26)}50%{box-shadow:0 0 18px 5px rgba(124,92,255,.55)}}
  @keyframes cxpulseGold{0%,100%{box-shadow:0 0 8px 2px rgba(201,147,42,.38)}50%{box-shadow:0 0 24px 8px rgba(201,147,42,.72)}}
  .fx-purple{border-color:#9a7cff;animation:cxpulse 3s ease-in-out infinite}
  .fx-gold{border-color:var(--gold);animation:cxpulseGold 2.2s ease-in-out infinite}
  .fx-purple::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 0 38%,rgba(206,186,255,.16) 46%,rgba(238,230,255,.48) 50%,rgba(206,186,255,.16) 54%,transparent 62% 100%);
    background-size:280% 100%;animation:cxsheen 4.8s linear infinite}
  .fx-gold::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 0 34%,rgba(255,238,178,.34) 44%,rgba(255,253,234,.92) 50%,rgba(255,238,178,.34) 56%,transparent 64% 100%);
    background-size:280% 100%;animation:cxsheen 2.4s linear infinite}
  .drawbox{margin-top:12px;background:#f7faf8;border-radius:12px;padding:11px 12px}
  .drawbox .t{font-size:13px;color:var(--ink2);margin-bottom:8px}
  .drawbox .acts{display:flex;gap:8px;flex-wrap:wrap}
  .drawbox .note{font-size:11px;color:#9aa8a0;margin-top:8px;line-height:1.6}
  .pend{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:10px;background:#eef6f1;color:#2f6b4f}
  .pend.wait{background:#fdf3dd;color:#8a6511}
  .pend.bad{background:#fdeaea;color:#b4382a}
  /* vT129 作业等级统计 */
  .stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .stg{background:#f7faf8;border-radius:11px;padding:8px 3px;text-align:center}
  .stg b{display:block;font-size:19px;line-height:1.25}
  .stg span{font-size:11px;color:var(--ink2)}
  .stg.g b{color:#2b7a4b}
  .stg.y b{color:#a97a11}
  .stg.z b{color:#5f6b7a}
  .stg.r b{color:#b4382a}
  .stg.p b{color:#7c3aed}
  .stg.x b{color:#dc2626}
  .stbar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:#eef2ef;margin:12px 0 11px}
  .stbar i{display:block;height:100%;transition:width .4s}
  .stbar .b-g{background:#4caf7d}
  .stbar .b-y{background:#e0b552}
  .stbar .b-z{background:#9aa8b5}
  .stbar .b-r{background:#e06a5a}
  .stbar .b-p{background:#8b5cf6}
  .stbar .b-x{background:#d3402f}
  .stfoot{font-size:11.5px;color:#9aa8a0;margin-top:9px;line-height:1.7}
  /* 成绩 */
  .gr{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f2}  .gr:last-child{border-bottom:0}
  .gr .l{font-size:13px}
  .gr .l small{color:#9aa8a0;font-size:11px;margin-left:6px}
  .gr .r{display:flex;align-items:center;gap:8px}
  .gr .sc{font-size:15px;font-weight:700}
  /* vT141 成绩等级方式：只给字母，不给数字 */
  .gr .lvb{font-size:14px;font-weight:800;letter-spacing:.4px;padding:2px 11px;border-radius:8px;font-variant-numeric:tabular-nums}
  .gr .ga1{background:#d9f2e2;color:#1c7a46}
  .gr .ga{background:#e6f4ea;color:#2b7a4b}
  .gr .gb{background:#e6effa;color:#255d9e}
  .gr .gc{background:#fdf3dd;color:#a97a11}
  .gr .gd{background:#fdeedd;color:#b0691a}
  .gr .ge{background:#fdeaea;color:#b4382a}
  .gmode{font-size:11px;color:#9aa8a0;margin-top:9px;line-height:1.7}
  /* 点评 */
  .cmt{padding:9px 0;border-bottom:1px solid #f1f5f2}
  .cmt:last-child{border-bottom:0}
  .cmt .d{font-size:11px;color:#9aa8a0;margin-bottom:3px}
  .cmt .tx{font-size:13px;color:#3c4b43}
  .foot{text-align:center;font-size:12px;color:#9aa8a0;padding:10px 0 0;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(30,45,38,.9);color:#fff;
    font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:86%}
  .toast.on{opacity:1}
  .skel{height:14px;background:#eef2ef;border-radius:7px;margin:8px 0;animation:sk 1.2s infinite}
  @keyframes sk{0%,100%{opacity:.6}50%{opacity:1}}
  /* ===== vT155 家长端进化（升级）庆祝浮层 ===== */

     老师网页端「自动批准」开启时数秒内入账；未开启则等老师手动批准

  /* ---------------- vT180 评价分析反馈（家长端）----------------
    只输出反馈性结论。单科跟踪内部参照得分表现与班级位次变化，但不直接暴露具体数据或刻度。
    三块：① 单科跟踪（进退步、波动）；② 阶段全科（偏科提示）；③ 整体状态反馈。 */
  function anaOf(v) {
    var list = (v.grades || []).filter(function (g) {
      return g && !isNaN(Number(g.score));
    }).map(function (g) {
      var full = Number(g.full) || 100;
      var r = Math.round(Number(g.score) / full * 100);
      return {
        exam: String(g.exam || '最近一次评价').replace(/考试/g, '评价'),
        subject: g.subject || '其他',
        rate: Math.max(0, Math.min(100, r)),
        rank: Number(g.rank) || 0,
        rankN: Number(g.rankN) || 0,
        date: dateOnly(g.date || '')
      };
    }).sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    if (!list.length) return null;

    var bySub = {};
    list.forEach(function (g) { (bySub[g.subject] = bySub[g.subject] || []).push(g); });

    /* 单科跟踪：默认语文；没有语文记录时取记录最多的科目 */
    var subKeys = Object.keys(bySub);
    var pickSub = bySub['语文'] ? '语文' : subKeys.sort(function (a, b) {
      return bySub[b].length - bySub[a].length;
    })[0];
    var sList = bySub[pickSub] || [];

    /* vT235：全部题目作答后才能提交（旧页面局部状态 / 直接调函数也拦住） */
    var s = qzStat();
    if (s.answered < s.total) { toast('还有 ' + (s.total - s.answered) + ' 题没作答，全部答完才能提交'); return }
    st.items.forEach(function (q) {
      if (!q || done[q.id]) return;
      var p = st.picked[q.id];
      if (p == null) return;
      var ok = Number(p) === Number(q.ans);
      answers.push({ q: q.id, a: Number(p), ok: ok });
      if (ok) right++;
    });
    if (!answers.length) { toast('还没有作答的题目'); return }
    if (!ST.snap.parentEssayToken || !ST.snap.parentEssayRepo) { toast('老师还没开通家长通道，暂时不能提交'); return }
    var rec = {
      id: 'qz_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      studentId: ST.name, studentName: ST.name, action: 'quiz',
      date: st.date, answers: answers, correct: right, total: answers.length,
      at: Date.now(), atText: ymd(), status: 'pending', by: 'parent-web',
      ts: Date.now(), updatedAt: Date.now(), updatedBy: 'parent'
    };
    var body = { access_token: ST.snap.parentEssayToken, content: b64en(utf8Encode(JSON.stringify(rec))), message: '家长竞答 ' + rec.id };
    var url = proposalUrl(rec.id + '.json', false);
    toast('正在提交…', 900);
    /* vT223：Gitee PUT 新建文件报 400「sha is missing」；改 POST 新建，已存在才 GET sha 后 PUT */
    var sendQ = function (method, extra) {
      var b = {}; Object.keys(body).forEach(function (k) { b[k] = body[k] });
      Object.keys(extra || {}).forEach(function (k) { b[k] = extra[k] });
      return fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
    };
    sendQ('POST').then(function (r) {
      if (r.ok || (r.status !== 400 && r.status !== 409 && r.status !== 404)) return r;
      return fetch(proposalUrl(rec.id + '.json', true)).then(function (j) { return j.json() })
        .then(function (j) { return sendQ('PUT', j && j.sha ? { sha: j.sha } : {}) });
    })
      .then(function (r) { if (!r.ok) throw new Error('提交失败 ' + r.status); return r; })
      .then(function () {
        /* 本机先记为已答，避免刷新后又能重复作答拿分（服务端仍会再校验一次） */
        var dm = {};
        try { dm = JSON.parse(localStorage.getItem(QZ_LS + '_done') || '{}') || {}; } catch (e) {}
        answers.forEach(function (a) { dm[a.q] = 1; });
        try { localStorage.setItem(QZ_LS + '_done', JSON.stringify(dm)); } catch (e2) {}
        st.submitted = true;
        var _net = qzNetScore(right);
        st.msg = '答对 ' + right + ' / ' + answers.length + ' 题，' + (_net > 0 ? '+' : '') + _net + ' 分，等待入账';
        qzSave();
        ST.pending = { id: rec.id, name: ST.name, action: 'quiz', label: '每日竞答', at: rec.at, status: 'pending' };
        savePending(); renderMain(); startPoll();
        try { paRepAdd('quiz'); } catch (e7) {}
      })
      .catch(function (e) { toast('提交失败：' + ((e && e.message) || '网络问题')); });
  }

  /* vT224 跨天自动刷新：家长常把页面留一晚上不关，第二天打开看到的还是昨天的「今日作业」

  var _lastDay = ymd();
  function dayGuard() {
    var d = ymd();
    if (d === _lastDay) return;
    _lastDay = d;
    try { if (ST.access && ST.code && ST.snap) refresh(); } catch (e) { }

  setInterval(dayGuard, 30000);

  /* vT210 灵宠数据延迟自愈：打开页面时快照里还没有灵宠（老师刚发/快照缓存旧），
     隔 6 秒、18 秒各静默重拉一次快照；拿到灵宠就渲染并停。
     全程不弹 toast、不打断家长，最多试 2 次，避免无意义请求。 */
  var _paPetRetryN = 0;
  function paPetRetry(v) {
    try {
      var has = ((v && v.codex) || []).some(function (p) { return cxIsPet(p); });
      if (has || _paPetRetryN >= 2) return;
      var repo; try { repo = decodeAccess(ST.access); } catch (e) { return; }
      var delays = [6000, 18000];
      var d = delays[_paPetRetryN];
      _paPetRetryN++;
      setTimeout(function () {
        loadSnap(repo).then(function (snap) {
          var b = (snap.blocks || {})[ST.name]; if (!b) return;
          var per = unsealBlock(b.data, ST.code);
          var now = ((per && per.codex) || []).some(function (p) { return cxIsPet(p); });
          if (now) { ST.snap = snap; ST.per = per; renderMain(); }   /* 有灵宠了→立即重渲染 */
        }).catch(function () {});
      }, d);
    } catch (e) {}
  }

  /* vT211 家长端静默自动刷新：以前只在提交提案后轮询，平时不刷新，

     真变了才重渲染（避免闪烁/打断阅读），后台/有提案在轮询时跳过。 */
  var _paAutoT = null;
  function paSig(snap, per) {
    try {
      return String((snap && snap.ts) || 0) + '|' +
        (((per && per.codex) || []).length) + '|' +
        Math.round(Number((per && per.points && per.points.total) || 0)) + '|' +

  function paAutoRefreshStart() {
    if (_paAutoT) return;
    _paAutoT = setInterval(function () {

          var per = unsealBlock(b.data, ST.code);
          if (paSig(snap, per) === paSig(ST.snap, ST.per)) return;    /* 没变，什么都不做 */
          ST.snap = snap; ST.per = per; renderMain();
        }).catch(function () {});
      } catch (e) {}
    }, 45000);
  }

  function goLogin() {
    ST.access = ST.access || ''; ST.name = ST.name || ''; ST.code = '';

  /* ---------- vT246 家长使用回执（老师端「👪 家长后台」统计用） ----------
     家长端是纯静态页，老师以前完全看不到"谁绑定过、谁天天在看、谁一次没点开"。
     现在家长成功进入后，往提案仓库写一份 pa/{学生姓名}.json：
       name / firstAt / lastAt / opens(累计打开) / stay(累计停留秒) / days(每日打开与动作)
       / acts(动作合计) / ev(最近 40 条动作时间线) / dev(设备) / ver(页面版本)
     只写这些行为计数，**不写绑定码、不写成绩与作业内容**。
     合并式写入（GET→合并→PUT），失败静默补回待发队列，绝不阻塞家长的任何操作。 */
  var PA_REP_MKV = 'wb_pa_rep_v1';
  var PA_REP = { pend: { opens: 0, stay: 0, acts: {}, days: {}, ev: [] }, timer: 0, busy: false, dirty: false, last: Date.now(), opened: false };
  var PA_REP_MAX_EV = 40, PA_REP_MAX_DAY = 90;
  function paRepVer() { return (window.PA_PAGE_VER || 'v246'); }
  function paRepDayKey(ts) {
    var d = ts ? new Date(ts) : new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function paRepDev() {
    var ua = String((navigator && navigator.userAgent) || '');
    var os = /iPhone|iPad|iPod/i.test(ua) ? 'iOS' : (/Android/i.test(ua) ? 'Android' : (/Windows/i.test(ua) ? 'Windows' : (/Macintosh|Mac OS/i.test(ua) ? 'Mac' : '其他')));
    var app = /MicroMessenger/i.test(ua) ? '微信' : (/QQ\//i.test(ua) ? 'QQ' : (/Edg\//i.test(ua) ? 'Edge' : (/Chrome\//i.test(ua) ? 'Chrome' : (/Safari\//i.test(ua) ? 'Safari' : '浏览器'))));
    return { dev: os + ' · ' + app, ua: ua.slice(0, 160) };
  }
  function paRepUrl(withToken) {
    var owner = (ST.snap && ST.snap.parentEssayOwner) || '', repo = (ST.snap && ST.snap.parentEssayRepo) || '';
    return GITEE + '/repos/' + enc(owner) + '/' + enc(repo) + '/contents/pa/' + enc(ST.name || '') + '.json' +
      (withToken ? ('?ref=master&access_token=' + enc((ST.snap && ST.snap.parentEssayToken) || '')) : '');
  }
  /* 记一次行为：act = open / draw / feed / growdraw / growfeed / quiz */
  function paRepAdd(act) {
    var p = PA_REP.pend, now = Date.now();
    var gap = Math.round((now - PA_REP.last) / 1000);
    if (gap > 0) p.stay += Math.min(180, gap);   /* 停留时长：按两次动作间隔估算，单次最多算 3 分钟 */
    PA_REP.last = now;
    if (act === 'open') p.opens += 1;
    if (act && act !== 'open') {
      p.acts[act] = (Number(p.acts[act]) || 0) + 1;
      var dk = paRepDayKey(now), dd = p.days[dk] || (p.days[dk] = { v: 0 });
      dd[act] = (Number(dd[act]) || 0) + 1;
      p.ev.push({ t: now, a: act });
      if (p.ev.length > 12) p.ev = p.ev.slice(-12);
    } else if (act === 'open') {
      var dk2 = paRepDayKey(now), dd2 = p.days[dk2] || (p.days[dk2] = { v: 0 });
      dd2.v = (Number(dd2.v) || 0) + 1;
    }
    paRepQueue();
  }
  function paRepQueue(ms) {
    if (PA_REP.timer) return;
    PA_REP.timer = setTimeout(function () { PA_REP.timer = 0; paRepFlush(); }, ms || 2500);
  }
  function paRepDup(o) {
    return {
      opens: Number(o.opens) || 0, stay: Number(o.stay) || 0,
      acts: Object.assign({}, o.acts || {}), days: JSON.parse(JSON.stringify(o.days || {})), ev: (o.ev || []).slice()
    };
  }
  /* 合并：本地待发 + 云端已有（计数相加，天/动作逐项相加，时间线合并去重后保留最近 40 条） */
  function paRepMerge(base, add, name) {
    base = base && typeof base === 'object' ? base : {};
    var out = { v: 1, name: name || base.name || '', firstAt: Number(base.firstAt) || 0, lastAt: Number(base.lastAt) || 0 };
    out.opens = (Number(base.opens) || 0) + (Number(add.opens) || 0);
    out.stay = (Number(base.stay) || 0) + (Number(add.stay) || 0);
    out.acts = {};
    [base.acts || {}, add.acts || {}].forEach(function (m) {
      Object.keys(m).forEach(function (k) { out.acts[k] = (Number(out.acts[k]) || 0) + (Number(m[k]) || 0); });
    });
    out.days = {};
    [base.days || {}, add.days || {}].forEach(function (m) {
      Object.keys(m).forEach(function (d) {
        var src = m[d] || {}, dst = out.days[d] || (out.days[d] = {});
        Object.keys(src).forEach(function (k) { dst[k] = (Number(dst[k]) || 0) + (Number(src[k]) || 0); });
      });
    });
    var dk = Object.keys(out.days).sort();
    if (dk.length > PA_REP_MAX_DAY) { dk.slice(0, dk.length - PA_REP_MAX_DAY).forEach(function (d) { delete out.days[d]; }); }
    var ev = (base.ev || []).concat(add.ev || []).filter(function (e) { return e && e.t; });
    ev.sort(function (a, b) { return a.t - b.t; });
    var seen = {};
    out.ev = ev.filter(function (e) { var k = e.t + '|' + e.a; if (seen[k]) return false; seen[k] = 1; return true; }).slice(-PA_REP_MAX_EV);
    out.dev = base.dev || ''; out.ua = base.ua || ''; out.ver = paRepVer();
    if (!out.dev) { var d = paRepDev(); out.dev = d.dev; out.ua = d.ua; }
    out.firstAt = out.firstAt || Date.now();
    out.lastAt = Math.max(Number(base.lastAt) || 0, Date.now());
    return out;
  }
  function paRepFlush(done) {
    var fin = typeof done === 'function' ? done : function () {};
    var snap = ST.snap || {};
    if (!ST.name || !snap.parentEssayToken || !snap.parentEssayRepo) { fin(false); return; }
    var pend = PA_REP.pend;
    if (!pend.opens && !pend.stay && !Object.keys(pend.acts).length) { fin(false); return; }
    if (PA_REP.busy) { PA_REP.dirty = true; fin(false); return; }
    PA_REP.busy = true;
    var mine = paRepDup(pend);                 /* 本次要发的增量 */
    PA_REP.pend = { opens: 0, stay: 0, acts: {}, days: {}, ev: [] };
    var restore = function () {                 /* 失败：把增量并回待发队列 */
      var p = PA_REP.pend;
      p.opens += mine.opens; p.stay += mine.stay;
      Object.keys(mine.acts).forEach(function (k) { p.acts[k] = (Number(p.acts[k]) || 0) + mine.acts[k]; });
      Object.keys(mine.days).forEach(function (d) {
        var src = mine.days[d], dst = p.days[d] || (p.days[d] = {});
        Object.keys(src).forEach(function (k) { dst[k] = (Number(dst[k]) || 0) + (Number(src[k]) || 0); });
      });
      p.ev = p.ev.concat(mine.ev);
    };
    var body = { access_token: snap.parentEssayToken };
    var write = function (rec, sha) {
      var payload = { access_token: snap.parentEssayToken, content: b64en(utf8Encode(JSON.stringify(rec))), message: '家长回执 ' + ST.name };
      if (sha) payload.sha = sha;
      return api(paRepUrl(false), {
        method: sha ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    };
    api(paRepUrl(true)).then(function (j) {
      var base = {};
      try { base = JSON.parse(b64Json(j.content)) || {}; } catch (e) {}
      return write(paRepMerge(base, mine, ST.name), j.sha);
    }, function (e) {
      if (e && (e.status === 404 || e.status === 400)) {
        return write(paRepMerge({}, mine, ST.name), '');
      }
      throw e;
    }).then(function () {
      PA_REP.busy = false;
      fin(true);
      if (PA_REP.dirty) { PA_REP.dirty = false; paRepQueue(1200); }
    }).catch(function () {
      restore();
      PA_REP.busy = false;
      fin(false);
      paRepQueue(30000);   /* 网络差就 30 秒后再试，家长完全无感 */
    });
  }
  /* 打开页面只记一次（同一会话内刷新不再累加打开数，避免刷一次涨一次） */
  function paRepOpenOnce() {
    if (PA_REP.opened) return;
    PA_REP.opened = true;
    try {
      var k = PA_REP_MKV + '_s';
      var last = Number(sessionStorage.getItem(k) || 0);
      if (Date.now() - last < 30 * 60 * 1000) { PA_REP.last = Date.now(); return; }   /* 半小时内算同一次浏览 */
      sessionStorage.setItem(k, String(Date.now()));
    } catch (e) {}
    paRepAdd('open');
    paRepQueue(1500);
  }
  try { window.addEventListener('pagehide', function () { paRepFlush(); }); } catch (e) {}
  try { document.addEventListener('visibilitychange', function () { if (document.hidden) paRepFlush(); }); } catch (e) {}
  window.__paRep = { add: paRepAdd, flush: paRepFlush, pend: function () { return PA_REP.pend; }, merge: paRepMerge, reset: function () { PA_REP = { pend: { opens: 0, stay: 0, acts: {}, days: {}, ev: [] }, timer: 0, busy: false, dirty: false, last: Date.now(), opened: false }; } };

  /* ---------- 抽图鉴 / 集卡：写 pq/ 提案 → 轮询结果 ---------- */

    } catch (e) {}
  }
  /* vT260 真即时揭晓：翻牌开奖动画。先亮背面「？？？」转 1.1 秒，
     再翻到正面显示预抽到的卡/灵宠；动画放完由 pendText 接着显示「抽到 XX」大卡面。
     pick = {defId,name,img,tier,isHidden}（抽卡）或 {defId,name,img,tier}（抽灵宠）。 */
  function drawRevealFx(pick, action) {
    try {
      var old = document.getElementById('drawFx');
      if (old && old.parentNode) old.parentNode.removeChild(old);
      if (!pick || !pick.name) return;   /* 没有预抽结果（快照未含）→ 跳过动画，退回等待 */
      var hid = !!pick.isHidden;
      var d = document.createElement('div');
      d.id = 'drawFx';
      d.innerHTML = '<div class="dfx-stage">' +
        '<div class="dfx-card">' +
          '<div class="dfx-face dfx-back"><div class="q">❔</div><div class="t">揭 晓 中…</div></div>' +
          '<div class="dfx-face dfx-front' + (hid ? ' hidden-tier' : '') + '">' +
            '<div class="dfx-tier">' + (hid ? '✦ 隐藏款 ✦' : esc(pick.tier || '普通款')) + '</div>' +
            (pick.img ? '<img class="dfx-img" src="' + esc(pick.img) + '" alt="">' : '<div class="dfx-emo">' + (action === 'growdraw' ? '🐾' : '🎴') + '</div>') +
            '<div class="dfx-nm">' + esc(pick.name) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="dfx-cap">✨ 抽到「' + esc(pick.name) + '」！</div>' +
        '<div class="dfx-sub">结果已锁定，老师批准时就会正式入账</div>' +
      '</div>';
      document.body.appendChild(d);
      setTimeout(function () { d.classList.add('flip'); }, 1100);
      setTimeout(function () { d.classList.add('out'); }, 3200);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 3700);
    } catch (e) {}
  }
  /* ---------- vT210 灵宠欢迎语池：改为置顶板块内联显示，不再弹窗 ----------
     家长反馈弹窗要等数据到、还要手动关；现在欢迎语直接渲染在「孩子的灵宠」卡片里，
     随页面出现，随机挑一只灵宠说一句。 */
  var PET_WELCOME = [
    '小主人你回来啦～',
    '快来陪我玩吧！',
    '见到你我很高兴！',
    '今天也在想你哦～',
    '我等你好久啦，快摸摸我嘛～',
    '小主人，今天也要一起加油呀！',
    '嘿嘿，我又长大一点点了～',
    '陪我玩一会儿再去看作业嘛～'
  ];
  function submitProposal(action, cost, extra) {
    if (ST.busy) return;
    extra = extra || {};
    if (!ST.snap.parentEssayToken || !ST.snap.parentEssayRepo) {
      toast('老师还没开通家长通道：请老师在「家长端显示设置 → 家长端权限」里填仓库和令牌');
      return;
    }
    if (ST.pending && ST.pending.status === 'pending') { toast('上一笔还在等待，稍等再试'); return; }
    var food = extra.food ? (feedFoods().filter(function (x) { return x.k === extra.food; })[0]) : null;
    var actName = (action === 'growdraw') ? '抽一只成长灵宠'
      : (action === 'growfeed') ? ('给「' + (extra.petName || '灵宠') + '」喂一份' + (food ? food.n : '食物'))
        : '抽一张灵杰卡';
    if (!confirm('帮「' + ST.name + '」' + actName + '，消耗 ' + cost + ' 启灵积分？\n（' +
      (ST.snap.autoApprove ? '老师已开启自动批准，提交后自动入账' : '需老师批准后生效') + '）')) return;
    ST.busy = true;
    /* vT260 真即时揭晓：从本生加密块的预抽结果里取这一抽的卡片/灵宠。
       抽卡(action=feed) 用 preDraw.card；抽灵宠(growdraw) 用 preDraw.pet。
       pickDefId 随提案提交，老师批准时采信它；pick 存本地供动画后立即揭晓。 */
    var pd = (ST.per && ST.per.preDraw) || {};
    var pick = (action === 'growdraw') ? (pd.pet || null) : (action === 'feed' ? (pd.card || null) : null);
    var rec = {
      id: 'pq_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      studentId: ST.name, studentName: ST.name, action: action, item: '',
      petId: extra.petId || '', defId: extra.defId || '', food: extra.food || '',
      pickDefId: pick ? (pick.defId || '') : '', pickBy: pick ? 'preDraw' : '',
      at: Date.now(), atText: ymd(), status: 'pending', by: 'parent-web',
      ts: Date.now(), updatedAt: Date.now(), updatedBy: 'parent'
    };
    var body = {
      access_token: ST.snap.parentEssayToken,
      content: b64en(utf8Encode(JSON.stringify(rec))),
      message: '家长提案 ' + rec.id
    };
    var url = proposalUrl(rec.id + '.json', false);
    /* vT223：Gitee contents API 变更——PUT 新建文件一律报 400「sha is missing」（不再返回 404）。
       正确做法：先 POST 到具体文件路径新建（201）；若文件已存在（400/409）则 GET 拿 sha 再 PUT 更新。
       旧逻辑只认 404 才 fallback 到 POST，导致提案从此提交失败（「收不到家长提案」）。 */
    var send = function (method, extraBody) {
      var b = {}; Object.keys(body).forEach(function (k) { b[k] = body[k] });
      Object.keys(extraBody || {}).forEach(function (k) { b[k] = extraBody[k] });
      return api(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
    };
    send('POST').catch(function (e) {
      var st = e && e.status;
      if (st === 400 || st === 409 || st === 404) {
        /* 文件已存在 → 拿 sha 后 PUT 更新（合并进 body） */
        return api(proposalUrl(rec.id + '.json', true)).then(function (j) {
          if (j && j.sha) return send('PUT', { sha: j.sha });
          return send('PUT');
        });
      }
      throw e;
    }).then(function () {
      ST.busy = false;
      ST.pending = { id: rec.id, name: ST.name, action: action, label: actName, at: rec.at,
                     status: 'pending', pick: pick };   /* vT260 pick 供 pendText 即时揭晓 */
      if (action === 'growfeed') petFeedThanksFx(extra);   /* vT198 喂养成功的小特效 */
      else if (pick) drawRevealFx(pick, action);           /* vT260 抽卡/抽灵宠：翻牌即时揭晓 */
      try { paRepAdd(action === 'growdraw' ? 'growdraw' : (action === 'growfeed' ? 'growfeed' : 'feed')); } catch (e6) {}
      savePending(); renderMain(); startPoll();
    }).catch(function (e) {
      ST.busy = false;
      toast('提交失败：' + ((e && e.message) || '网络问题'));
    });
  }
  var POLL = null;
  function startPoll() {
    if (POLL) return;
    var tries = 0;
    POLL = setInterval(function () {
      tries++;
      if (!ST.pending || ST.pending.status !== 'pending' || tries > 40) {
        clearInterval(POLL); POLL = null;
        /* 等了约 2 分钟还没结果：多半是老师的工作台没开着（自动批准靠它执行），提示后再让家长重试 */
        if (ST.pending && ST.pending.status === 'pending' && tries > 40) {
          ST.pending.status = 'held';
          ST.pending.msg = '还没生效：老师的工作台可能没打开，过一会儿再点一次即可';
          savePending(); renderMain();
        }
        return;
      }
      var url = proposalUrl(ST.pending.id + '.json', true);
      api(url).then(function (j) {
        var rec = JSON.parse(b64Json(j.content));
        if (!rec || rec.status === 'pending') return;
        if (rec.status === 'done') {
          ST.pending.status = 'done'; ST.pending.msg = rec.result || '老师已批准';
          savePending(); renderMain(); clearInterval(POLL); POLL = null;
          setTimeout(refresh, 1500);    /* 快照稍后才会重发，先等一下再刷新 */
        } else if (rec.status === 'held') {
          ST.pending.status = 'held'; ST.pending.msg = rec.heldReason || '需要老师处理';
          savePending(); renderMain(); clearInterval(POLL); POLL = null;
        }
      }).catch(function () { /* 文件可能还没生成，继续等 */ });
    }, 3000);
  }

  /* ---------- 启动 ---------- */
  /* 测试 / 自检钩子：把纯数据函数挂出来，方便离线核对统计口径（不参与页面渲染） */
  window.__paHwStat = hwStatOf;
  window.__paCard = cxCard;   /* vT246 卡面渲染（测试用：核对灵杰「名称 + 品级·分类」） */
  window.__paBuildView = buildView;
  window.__paAnaFeedback = anaOf;
  window.__paPetRel = petRel;
  function boot() {
    try {
      ST.access = localStorage.getItem(K_ACCESS) || '';
      ST.name = localStorage.getItem(K_NAME) || '';
      ST.code = localStorage.getItem(K_CODE) || '';
    } catch (e) {}
    loadPending();
    if (!ST.access || !ST.name || !ST.code) { renderLogin(''); return; }
    var repo;
    try { repo = decodeAccess(ST.access); } catch (e) { renderLogin(''); return; }
    document.getElementById('app').innerHTML = '<div class="wrap" style="padding-top:40px">' +
      '<div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>' +
      '<div class="card"><div class="skel" style="width:55%"></div><div class="skel"></div></div></div>';
    loadSnap(repo).then(function (snap) {
      ST.snap = snap;
      var b = (snap.blocks || {})[ST.name];
      if (!b) throw new Error('名单里没有「' + ST.name + '」');
      ST.per = unsealBlock(b.data, ST.code);
      renderMain();
      try { paRepOpenOnce(); } catch (e5) {}
    }).catch(function (e) {
      renderLogin((e && e.message) || '读取失败，请重试');
    });
  }
  /* vT157 测试钩子：只有带 ?test=1 打开时才挂全局，正常家长使用不受影响。
     给一份假快照就能整页渲染，方便截图核对评价分析反馈 / 班级诵读进度。 */
  try {
    if (String(location.search || '').indexOf('test=1') >= 0) {
      window.__ppTest = {
        set: function (nm, snap, per) { ST.access = 'test'; ST.name = nm; ST.snap = snap; ST.per = per; ST.code = 'TEST'; renderMain(); },
        st: ST,
        pendText: function () { return pendText() },   /* vT260 验收即时揭晓文案 */
        submitProposal: submitProposal                 /* vT260 验收提案带 pickDefId */
      };
    }
  } catch (e) {}
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
